apply plugin: 'com.android.application'

android {
    namespace "com.roamkeep.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.roamkeep.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 64
        versionName "4.8.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
def ksProps = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (ksFile.exists()) { ksProps.load(new FileInputStream(ksFile)) }

signingConfigs {
  release {
    if (ksProps['storeFile']) {
      storeFile     file(ksProps['storeFile'])
      storePassword ksProps['storePassword']
      keyAlias      ksProps['keyAlias']
      keyPassword   ksProps['keyPassword']
    }
  }
 }

buildTypes {
  release {
    signingConfig signingConfigs.release
    // R8: shrink + obfuscate the Java side so a decompiled APK yields
    // mangled names instead of a readable codebase. The Capacitor
    // bridge and our plugin survive via keep rules in proguard-rules.pro.
    minifyEnabled true
    proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
  }
 }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Google Play Services location — needed by the native geofence
    // plugin (GeofencingClient). This is the same library
    // @capacitor-community/background-geolocation pulls in, so in
    // practice it's usually already present transitively, but we
    // depend on it explicitly so the plugin builds on its own.
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Firebase Messaging — RoamkeepMessagingService extends the Capacitor
    // push plugin's service to handle the relay's content-free wake-up.
    // The plugin declares this as `implementation`, so it does not reach
    // our compile classpath; version pinned to match the plugin's to keep
    // a single copy on the runtime classpath.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"

    // WorkManager — drives the boot-time periodic location poll
    // (LocationUpdateWorker) that keeps keep_members.lat/lng moving
    // until the user opens the app post-reboot, at which point
    // MainActivity cancels the work and the BG-geolocation plugin's
    // foreground service takes over.
    implementation 'androidx.work:work-runtime:2.9.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
