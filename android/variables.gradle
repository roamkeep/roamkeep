ext {
    minSdkVersion = 23
    // Android 16. Play requires the target to be within one year of the
    // latest release: from 31 Aug 2026 an app targeting 35 cannot be
    // updated at all, which surfaced as a closed-testing rejection.
    //
    // Needs AGP 8.9.1 or later (root build.gradle has 8.13.2 since 4.11.3;
    // 8.7.2 was only tested to 35 and warned on every build). The SDK also
    // ships an "android-36.1" minor platform, which 8.13 could build, but
    // nothing here needs it: base 36 satisfies Play.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    // Shared by @capacitor/push-notifications and by :app, which extends
    // the plugin's MessagingService for content-free push wake-ups.
    firebaseMessagingVersion = '24.1.0'
}