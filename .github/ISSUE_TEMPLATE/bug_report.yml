name: Something isn't working
description: A bug in the app, the setup, or the server it installs.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Found a security problem?** Don't post it here: use
        [private reporting](https://github.com/roamkeep/roamkeep/security/advisories/new).

        **Please keep your family's privacy in mind.** Don't paste a setup or invite link, and blur
        or replace people's names, place names and addresses in anything you attach.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be made to happen?
      description: The steps, if you know them. "It happens on every drive home" is useful too.
  - type: input
    id: app
    attributes:
      label: Roamkeep version
      description: Family tab → Tracking diagnostics → App version.
      placeholder: "4.11.0"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Family server version
      description: Settings → Family server, for example "Version 17".
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 8, Android 16"
    validations:
      required: true
  - type: textarea
    id: journal
    attributes:
      label: Tracking diagnostics
      description: |
        For anything about locations, arrivals, alerts or battery: in the Family tab, turn on
        **Tracking diagnostics**, tap **Refresh**, and attach screenshots of the rows and the
        pipeline journal from around the time it happened. The journal is usually enough to see
        what went wrong without the phone in hand. Blur names and places first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I've removed names, places, addresses and links from what I've attached.
          required: true
