// Standalone. Deliberately NOT part of the Capacitor project in android/ —
// this is a test harness, it must never end up inside a shipped APK, and
// `cap sync` must never touch it.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "roamkeep-mockgps"
include ':app'
